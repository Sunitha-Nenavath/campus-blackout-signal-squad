<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Campus Blackout: Signal Squad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2c;--panel2:#102339;--line:#1d3550;--cyan:#54e4ef;--blue:#5096ff;--purple:#ad87ff;--green:#65e6ac;--red:#ff687a;--muted:#8da2b8;--white:#edf6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#163454 0%,var(--bg) 55%);font-family:Manrope,system-ui,sans-serif;color:var(--white);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1100px,100% - 36px);margin:auto}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0e}.brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:800;letter-spacing:.12em}.sigil{width:34px;height:34px;border:1px solid var(--cyan);border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-size:19px;box-shadow:0 0 22px #54e4ef2b}.tiny{color:var(--muted);font:11px 'DM Mono',monospace;letter-spacing:.08em}.screen{padding:58px 0 70px}.hero{max-width:760px;margin:35px auto 44px;text-align:center}.eyebrow{font:11px 'DM Mono',monospace;color:var(--cyan);letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(40px,8vw,78px);line-height:.99;letter-spacing:-.065em;margin:17px 0}.hero h1 span{color:var(--cyan)}.subtitle{color:#a8bbcf;font-size:16px}.alert{margin:34px auto 0;max-width:660px;padding:17px 22px;text-align:left;border:1px solid #ff687a63;background:linear-gradient(100deg,#6a203025,#102339);border-radius:14px}.alert strong{color:#ff8793;font:12px 'DM Mono',monospace;letter-spacing:.1em}.alert p{margin:9px 0 0;color:#c1cddd;font-size:13px;line-height:1.7}.columns{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;max-width:820px;margin:auto}.card{background:linear-gradient(145deg,#102339eF,#0b1828);border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:0 14px 50px #0002}.card h2{font-size:18px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.actions{display:flex;gap:10px;margin-top:19px}.btn{border:1px solid var(--line);border-radius:11px;padding:12px 16px;color:var(--white);background:#13283d;font-weight:700;transition:.18s}.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}.btn.primary{background:linear-gradient(110deg,#29bfdb,#398bff);color:#04111e;border:0;box-shadow:0 7px 24px #318fed38}.btn.quiet{background:transparent}.btn.small{padding:8px 11px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.field{margin-top:16px}.field label{display:block;color:#9eb2c8;font-size:12px;margin-bottom:7px}.field input{width:100%;border-radius:10px;background:#081523;border:1px solid #29415b;color:white;padding:13px;outline:none}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #54e4ef16}.hidden{display:none!important}.notice{color:#ff9aa5;font-size:12px;margin-top:12px;min-height:17px}.linkbtn{background:none;color:var(--cyan);border:0;padding:0;font:inherit}.foot{text-align:center;color:#6f849a;font-size:11px;margin:36px auto 0}.split{display:flex;justify-content:space-between;align-items:center;gap:16px}.roomcode{font:700 27px 'DM Mono',monospace;letter-spacing:.16em;color:var(--cyan)}.roster{display:grid;gap:9px;margin-top:17px}.player{display:flex;align-items:center;gap:12px;border:1px solid #ffffff0e;background:#0a1726;border-radius:12px;padding:12px}.avatar{width:34px;height:34px;border-radius:10px;background:#183c54;color:var(--cyan);display:grid;place-items:center;font-weight:800}.playername{font-size:13px;font-weight:700}.role{font:10px 'DM Mono',monospace;letter-spacing:.07em;color:var(--purple);margin-top:3px}.badge{margin-left:auto;font:10px 'DM Mono',monospace;color:var(--green)}.lobbygrid{display:grid;grid-template-columns:1fr .8fr;gap:16px;margin-top:20px}.roles{display:grid;gap:10px;margin-top:15px}.roleinfo{display:grid;grid-template-columns:94px 1fr;gap:10px;font-size:12px;line-height:1.5}.roleinfo b{font:10px 'DM Mono',monospace;color:var(--cyan);padding-top:2px}.rule{padding:10px 0;border-bottom:1px solid #ffffff0b;color:#bac9d8;font-size:12px}.rule:last-child{border:0}.dashhead{margin:34px 0 17px}.dashgrid{display:grid;grid-template-columns:1fr 290px;gap:16px}.timer{font:700 27px 'DM Mono',monospace;color:var(--cyan)}.timer.danger{color:var(--red);animation:pulse 1s infinite}.progress{height:5px;background:#1a3044;border-radius:4px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .4s}.mission{min-height:300px}.mission h2{font-size:25px;letter-spacing:-.04em;margin:12px 0}.circuit{display:flex;align-items:center;justify-content:center;gap:10px;margin:32px 0 24px}.node{width:52px;height:52px;border:1px solid #386083;background:#122b41;border-radius:14px;display:grid;place-items:center;font:700 18px 'DM Mono',monospace;color:var(--cyan)}.wire{width:24px;height:2px;background:var(--blue);box-shadow:0 0 12px var(--blue)}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}.choice{border:1px solid #29445f;background:#0a1828;border-radius:11px;color:#d8e8f5;padding:13px}.choice:hover{border-color:var(--cyan);background:#123047}.choice:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.hint{border-left:2px solid var(--purple);padding:10px 13px;background:#ad87ff0c;color:#c8badf;font-size:12px;line-height:1.6;margin-top:16px}.teamrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #ffffff0d}.teamrow:last-child{border:0}.online{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.offline{background:var(--red)}.teamrow .role{margin-left:auto;font-size:9px}.result{text-align:center;padding:65px 20px}.result .symbol{width:76px;height:76px;border:1px solid var(--green);border-radius:24px;display:grid;place-items:center;color:var(--green);font-size:34px;margin:0 auto 25px;box-shadow:0 0 36px #65e6ac22}.result.loss .symbol{color:var(--red);border-color:var(--red)}.result h1{font-size:clamp(32px,7vw,58px);line-height:1;letter-spacing:-.055em;margin:0 0 14px}.result p{color:#a8bbcf}.score{font:24px 'DM Mono',monospace;color:var(--cyan);margin:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#14283a;border:1px solid #31526b;border-radius:12px;padding:12px 17px;font-size:12px;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.net{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.net i{width:7px;height:7px;border-radius:50%;background:var(--green)}@keyframes pulse{50%{opacity:.55}}@media(max-width:700px){.screen{padding:30px 0 50px}.hero{margin:26px auto 30px}.columns,.lobbygrid,.dashgrid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,1fr)}.card{padding:20px}.dashhead{margin-top:22px}.circuit{gap:6px}.wire{width:15px}.node{width:44px;height:44px}.topbar{height:64px}}
</style></head>
<body><header class="shell topbar"><div class="brand"><div class="sigil">⌁</div><div>CAMPUS BLACKOUT<div class="tiny">SIGNAL SQUAD</div></div></div><div class="net" id="net"><i></i><span>Connecting</span></div></header><main id="app" class="shell"></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/config.js"></script>
<script>
const app=document.querySelector('#app'),net=document.querySelector('#net'),toast=document.querySelector('#toast');let ws,playerId=sessionStorage.getItem('signal-id'),roomCode=sessionStorage.getItem('signal-room'),myName=sessionStorage.getItem('signal-name'),state=null,puzzle=null,toastTimer;
const roles={ENGINEER:'Repairs generator circuits',HACKER:'Decodes security patterns',SCIENTIST:'Calculates power requirements',NAVIGATOR:'Finds clues and sequences',COMMANDER:'Tracks mission status and hints'};
function message(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o));else message('Reconnecting to the game server…')}
function connect(){const scheme=location.protocol==='https:'?'wss':'ws';const endpoint=window.SIGNAL_WS_URL||`${scheme}://${location.host}/ws`;ws=new WebSocket(endpoint);net.innerHTML='<i></i><span>Connecting</span>';ws.onopen=()=>{net.innerHTML='<i></i><span>Connected</span>';if(playerId&&roomCode&&myName)send({type:'reconnect',id:playerId,code:roomCode,name:myName})};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){playerId=m.id;roomCode=m.code;sessionStorage.setItem('signal-id',playerId);sessionStorage.setItem('signal-room',roomCode);sessionStorage.setItem('signal-name',myName||'')};if(m.type==='error'){message(m.message);if(/reconnect session has expired/i.test(m.message)){sessionStorage.clear();playerId=roomCode=myName=null;landing()}}if(m.type==='state'){state=m.state;puzzle=m.puzzle;render()}};ws.onclose=()=>{net.innerHTML='<i style="background:var(--red)"></i><span>Reconnecting</span>';setTimeout(connect,1200)};ws.onerror=()=>{}}connect();
function hero(){return `<div class="hero"><div class="eyebrow">Handshake AI Skills Studio × OpenAI</div><h1>One campus.<br><span>One signal.</span></h1><div class="subtitle">Five students. One blackout. 180 seconds to bring it all back.</div><div class="alert"><strong>⚠ &nbsp;WARNING: CAMPUS POWER GRID FAILURE</strong><p>All systems offline. Emergency power reserve: 180 seconds.<br>Your mission: Restore the campus before total system shutdown.</p></div></div>`}
function landing(){state=null;app.innerHTML=`<section class="screen">${hero()}<div class="columns"><div class="card"><h2>Assemble your squad</h2><div class="muted">Create a room and invite your crew, or join a team already in the field.</div><div class="actions"><button class="btn primary" onclick="showForm('create')">Create game</button><button class="btn" onclick="showForm('join')">Join game</button></div><div id="form"></div></div><div class="card"><h2>How to play</h2><div class="muted">Three linked missions. One shared clock. Talk through clues, then submit answers as a team.</div><div class="rule">01 &nbsp;Restore the generator circuit</div><div class="rule">02 &nbsp;Decode the security access code</div><div class="rule">03 &nbsp;Sequence the emergency grid</div><div class="rule">2–5 players · 180 seconds · no accounts</div></div></div><div class="foot">A cooperative campus mystery · Works on desktop and mobile</div></section>`}
function showForm(kind){document.querySelector('#form').innerHTML=`<div class="field"><label for="nickname">Your nickname</label><input id="nickname" maxlength="18" placeholder="e.g. Nova" autocomplete="nickname"></div>${kind==='join'?'<div class="field"><label for="code">Room code</label><input id="code" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;font-family:DM Mono,monospace;letter-spacing:.15em"></div>':''}<div class="actions"><button class="btn primary" onclick="enterRoom('${kind}')">${kind==='create'?'Create room':'Join room'}</button></div><div id="form-error" class="notice"></div>`;document.querySelector('#nickname').focus()}
function enterRoom(kind){const name=document.querySelector('#nickname').value.trim(),code=document.querySelector('#code')?.value.trim().toUpperCase();if(name.length<2){document.querySelector('#form-error').textContent='Use a nickname with at least 2 characters.';return}myName=name;sessionStorage.setItem('signal-name',name);send({type:kind,name,...(code?{code}:{})})}
function render(){if(!state)return;const me=state.players.find(p=>p.id===playerId);if(!me){landing();return}if(state.phase==='lobby'){lobby(me);return}if(state.phase==='playing'){game(me);return}result()}
function lobby(me){app.innerHTML=`<section class="screen"><div class="split"><div><div class="eyebrow">Mission lobby</div><h1 style="font-size:36px;letter-spacing:-.05em;margin:10px 0 4px">Squad assembly</h1><div class="muted">${state.players.length}/5 operators connected · At least 2 to launch</div></div><button class="btn quiet small" onclick="leave()">Leave room</button></div><div class="lobbygrid"><div class="card"><div class="split"><div><div class="tiny">ROOM CODE · SHARE WITH YOUR TEAM</div><div class="roomcode">${state.code}</div></div><button class="btn small" onclick="copyCode()">Copy code</button></div><div class="roster">${state.players.map((p,i)=>`<div class="player"><div class="avatar">${esc(p.name[0].toUpperCase())}</div><div><div class="playername">${esc(p.name)} ${p.id===state.host?'<span class="tiny">HOST</span>':''}</div><div class="role">${p.role||'SUPPORT'}</div></div><div class="badge" style="color:${p.connected?'var(--green)':'var(--red)'}">${p.connected?'● ONLINE':'○ RECONNECTING'}</div></div>`).join('')}</div><div class="actions"><button class="btn primary" ${state.host!==me.id||state.players.length<2?'disabled':''} onclick="send({type:'start'})">${state.host===me.id?'Launch mission →':'Waiting for host'}</button><span class="tiny" style="align-self:center">${state.players.length<2?'Need one more operator':''}</span></div></div><div class="card"><h2>Choose your specialty</h2><div class="muted">Roles are assigned automatically and each operator gets a different specialty.</div><div class="roles">${Object.entries(roles).map(([r,d])=>`<div class="roleinfo"><b>${r}</b><span class="muted">${d}</span></div>`).join('')}</div></div></div><div class="foot">Share the room code · Keep this tab open to stay connected</div></section>`}
function game(me){const sec=state.remaining,mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0'),pct=(state.solved.length/3)*100;app.innerHTML=`<section class="screen"><div class="split dashhead"><div><div class="eyebrow">Live operation · ${state.code}</div><h1 style="font-size:32px;letter-spacing:-.05em;margin:8px 0">Campus control</h1></div><div class="timer ${sec<=30?'danger':''}" aria-label="${mm} minutes ${ss} seconds">${mm}:${ss}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="tiny" style="margin:9px 0 16px">MISSION ${state.level+1} OF 3 · ${state.solved.length} SYSTEMS RESTORED</div><div class="dashgrid"><div class="card mission"><div class="eyebrow">${me.role||'SQUAD'} · ${roles[me.role]||'Team operator'}</div><h2>${esc(puzzle?.title||'Mission briefing')}</h2><div class="muted">${esc(puzzle?.story||'Coordinate with your squad and restore the system.')}</div><div class="circuit">${(state.level===0?['02','04','06','?']:state.level===1?['2','+','3','=','?']:['POWER','→','GRID','→','?']).map((x,i)=>`${i?'<div class="wire"></div>':''}<div class="node">${x}</div>`).join('')}</div><div class="muted"><b style="color:var(--white)">${esc(puzzle?.objective||'')}</b></div><div class="choices">${(puzzle?.options||[]).map(a=>`<button class="choice" onclick="solve('${a}')">${esc(a)}</button>`).join('')}</div><div class="hint">◈ &nbsp;SQUAD CLUE &nbsp;${esc(puzzle?.clue||'Share observations with your team.')}</div><div class="notice" aria-live="polite">${state.lastResult?.level===state.level?(state.lastResult.ok?'✓ '+esc(state.lastResult.by)+' restored this system.':'↻ '+esc(state.lastResult.by)+' tried a different route. Keep coordinating.'):'Work it out together, then choose the answer.'}</div></div><aside class="card"><div class="split"><h2>Squad status</h2><span class="tiny">${state.players.length}/5</span></div>${state.players.map(p=>`<div class="teamrow"><i class="${p.connected?'online':'online offline'}"></i><span class="playername">${esc(p.name)}${p.id===state.host?' ★':''}</span><span class="role">${p.role||'SUPPORT'}</span></div>`).join('')}<div class="rule" style="margin-top:15px">Shared score <b style="float:right;color:var(--cyan)">${state.score}</b></div><div class="rule">Restored systems <b style="float:right;color:var(--green)">${state.solved.length}/3</b></div><button class="btn quiet small" style="margin-top:13px" onclick="leave()">Leave mission</button></aside></div></section>`}
function solve(answer){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);send({type:'solve',answer});setTimeout(()=>document.querySelectorAll('.choice').forEach(b=>b.disabled=false),500)}
function result(){const won=state.phase==='won';app.innerHTML=`<section class="screen"><div class="card result ${won?'':'loss'}"><div class="symbol">${won?'✓':'×'}</div><div class="eyebrow">${won?'All systems online':'Emergency reserve depleted'}</div><h1>${won?'MISSION SUCCESSFUL':'MISSION FAILED'}</h1><p>${won?'CAMPUS POWER RESTORED! Your squad brought the university back online.':'CAMPUS SYSTEMS SHUT DOWN! The team ran out of emergency power.'}</p><div class="score">TEAM SCORE &nbsp; ${state.score}</div><div class="muted">${won?'Completed in '+(state.lastResult?.elapsed||0)+' seconds.':'Systems restored: '+state.solved.length+' of 3.'}</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="leave()">Return to home</button></div></div></section>`}
function leave(){send({type:'leave'});sessionStorage.clear();playerId=roomCode=myName=null;state=null;landing()}
function copyCode(){navigator.clipboard?.writeText(state.code).then(()=>message('Room code copied.')).catch(()=>message('Room code: '+state.code))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}landing();
</script></body></html>
